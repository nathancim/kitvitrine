<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Instrument Sans, system-ui, sans-serif" role="img" aria-label="Le fichier zip devient un dossier contenant le site">
  <rect width="720" height="360" rx="14" fill="#EEF1F3"/>
  <!-- zip -->
  <g transform="translate(70 110)">
    <path d="M0 8a8 8 0 0 1 8-8h70l34 34v106a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#fff" stroke="#161B26" stroke-width="2"/>
    <path d="M78 0v26a8 8 0 0 0 8 8h26" fill="none" stroke="#161B26" stroke-width="2"/>
    <path d="M44 14v10M44 30v10M44 46v10M44 62v10" stroke="#161B26" stroke-width="6" stroke-dasharray="4 4"/>
    <rect x="30" y="86" width="52" height="22" rx="4" fill="#F0BE3D"/><text x="56" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#161B26">ZIP</text>
    <text x="56" y="176" text-anchor="middle" font-size="14" fill="#161B26">kitvitrine-….zip</text>
  </g>
  <!-- arrow -->
  <g transform="translate(210 160)"><path d="M0 24h70" stroke="#0E5A47" stroke-width="3"/><path d="M62 12l14 12-14 12" fill="none" stroke="#0E5A47" stroke-width="3" stroke-linejoin="round"/>
  <text x="38" y="0" text-anchor="middle" font-size="13" fill="#0E5A47" font-weight="600">Extraire</text></g>
  <!-- folder window -->
  <g transform="translate(310 40)">
    <rect width="350" height="280" rx="10" fill="#fff" stroke="#161B26" stroke-width="2"/>
    <path d="M0 10a10 10 0 0 1 10-10h330a10 10 0 0 1 10 10v26H0z" fill="#161B26"/>
    <text x="16" y="23" font-size="13" fill="#fff" font-weight="600">Dossier du site</text>
    <g font-size="15" fill="#161B26">
      <g transform="translate(20 62)"><rect width="18" height="14" rx="2" fill="#B7C1C8"/><text x="30" y="12">assets</text></g>
      <g transform="translate(20 96)"><rect width="18" height="14" rx="2" fill="#B7C1C8"/><text x="30" y="12">sources-tailwind</text></g>
      <g transform="translate(20 130)"><rect width="14" height="18" rx="2" fill="#fff" stroke="#161B26"/><text x="30" y="14">index.html</text></g>
      <g transform="translate(10 158)"><rect width="330" height="34" rx="6" fill="#F0BE3D" opacity=".35"/><rect x="10" y="8" width="14" height="18" rx="2" fill="#fff" stroke="#161B26"/><text x="40" y="22" font-weight="700">MODIFIER-MON-SITE.html</text></g>
      <g transform="translate(20 208)"><rect width="14" height="18" rx="2" fill="#fff" stroke="#161B26"/><text x="30" y="14">LISEZMOI.md</text></g>
      <g transform="translate(20 240)"><rect width="14" height="18" rx="2" fill="#fff" stroke="#161B26"/><text x="30" y="14">LICENCE.txt</text></g>
    </g>
  </g>
</svg>
