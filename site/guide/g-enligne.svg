<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Instrument Sans, system-ui, sans-serif" role="img" aria-label="Illustration : le site est en ligne à une adresse netlify.app, à réclamer en créant un compte gratuit">
  <rect width="720" height="400" rx="14" fill="#EEF1F3"/>
  <g transform="translate(40 30)">
    <rect width="640" height="340" rx="10" fill="#fff" stroke="#161B26" stroke-width="2"/>
    <path d="M0 10a10 10 0 0 1 10-10h620a10 10 0 0 1 10 10v30H0z" fill="#DDE2E7"/>
    <circle cx="18" cy="20" r="5" fill="#B4443A"/><circle cx="34" cy="20" r="5" fill="#E2B13C"/><circle cx="50" cy="20" r="5" fill="#3F7A5A"/>
    <rect x="80" y="9" width="420" height="22" rx="11" fill="#fff"/><text x="96" y="25" font-size="13" fill="#161B26">app.netlify.com</text>
    <circle cx="60" cy="92" r="20" fill="#0E5A47"/><path d="M50 92l7 7 14-15" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="88" font-size="20" font-weight="700" fill="#161B26">Votre site est en ligne</text>
    <text x="96" y="110" font-size="14" fill="#5b6270">Adresse attribuée automatiquement :</text>
    <rect x="40" y="132" width="370" height="44" rx="8" fill="#EEF1F3" stroke="#DDE2E7"/>
    <text x="58" y="160" font-size="17" font-weight="600" fill="#0E5A47">https://joyeux-cabinet-1234.netlify.app</text>
    <rect x="40" y="200" width="250" height="44" rx="8" fill="#0E5A47"/><text x="165" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Créer un compte pour le garder</text>
    <g transform="translate(440 120)"><rect width="160" height="190" rx="8" fill="#FBFAF7" stroke="#DDE2E7"/>
      <rect x="14" y="16" width="70" height="8" rx="4" fill="#1F3A2E"/><rect x="14" y="40" width="120" height="14" rx="4" fill="#1F3A2E"/><rect x="14" y="60" width="96" height="14" rx="4" fill="#1F3A2E"/>
      <rect x="14" y="88" width="132" height="6" rx="3" fill="#B7C1C8"/><rect x="14" y="100" width="110" height="6" rx="3" fill="#B7C1C8"/>
      <rect x="14" y="122" width="60" height="18" rx="9" fill="#1F3A2E"/><rect x="0" y="152" width="160" height="38" fill="#1F3A2E"/></g>
